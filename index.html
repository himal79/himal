<!DOCTYPE html>
<html>
<head>
  <title>Simple Form</title>
</head>
<body>

<h2>Contact Form</h2>

<form id="myForm">
  <input type="text" name="name" placeholder="Your Name" required><br><br>
  <input type="text" name="phone" placeholder="Your Phone" required><br><br>
  <input type="text" name="add" placeholder="Your Phone" required><br><br>
  <button type="submit">Submit</button>
</form>

<p id="msg"></p>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxgPGswXBcL2M--yMs99otxXGtHK6h-UUuS6UzjuzF-LPNrywNE-WSJW7g3fz2Wz4Al/exec";

document.getElementById("myForm").addEventListener("submit", function(e){
  e.preventDefault();

  let formData = {
    name: this.name.value,
    phone: this.phone.value
    add: this.address.value
  };

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(formData)
  })
  .then(response => response.text())
  .then(data => {
    if(data === "Success"){
      document.getElementById("msg").innerText = "✅ Form submitted successfully!";
      document.getElementById("myForm").reset();
    } else {
      document.getElementById("msg").innerText = "❌ Failed!";
    }
  })
  .catch(error => {
    document.getElementById("msg").innerText = "❌ Error!";
  });

});
</script>

</body>
</html>
