<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरो वेबसाइट</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #1e40af;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>मेरो वेबसाइटमा स्वागत छ</h1>
    </header>

    <nav>
        <a href="#">होम</a>
        <a href="#">हाम्रो बारेमा</a>
        <a href="#">सेवा</a>
        <a href="#">सम्पर्क</a>
    </nav>

    <section class="hero">
        <h1>Hello World 👋</h1>
        <p>यो GitHub Pages मा host गरिएको एउटा साधारण वेबसाइट हो।</p>
        <a href="#" class="btn">थप जानकारी</a>
    </section>

    <footer>
        <p>&copy; 2026 मेरो वेबसाइट. सबै अधिकार सुरक्षित।</p>
    </footer>

</body>
</html>
